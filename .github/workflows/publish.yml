name: Publish to npm

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Check release version and JavaScript
        run: |
          node --input-type=module -e "import assert from 'node:assert/strict'; import { readFileSync } from 'node:fs'; const p = JSON.parse(readFileSync('package.json')); assert.match(p.version, /^\d+\.\d+\.\d+$/); assert.equal(process.env.GITHUB_REF_NAME, 'v' + p.version);"
          node --check lib/index.js
          node --check lib/client.js
      - name: Pack and publish
        run: |
          npm pack
          npm publish ./igaozp-dsh-font-settings-*.tgz
